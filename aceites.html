<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💧 Aceites — Fábrica La Ronda</title>
<style>
:root { --verde:#0d2d1a; --dorado:#d29914; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Segoe UI',system-ui,sans-serif; background:#0f1a12; color:#e8e8e8; padding:24px; }
h1 { color:var(--dorado); font-size:1.6rem; }
.sub { color:#9aa; font-size:.9rem; margin:4px 0 20px; }
.card { background:#16281b; border:1px solid #2a4a33; border-radius:14px; padding:18px; max-width:720px; margin-bottom:16px; }
.desc { color:#aab; font-size:.9rem; margin-bottom:14px; }
.fechas { background:#0f1a12; border:1px solid #1f3626; border-radius:10px; padding:12px; margin-bottom:12px; }
.fechas h3 { color:var(--dorado); font-size:.95rem; margin-bottom:8px; }
.tbody-wrap { overflow-y:auto; }
table { width:100%; border-collapse:collapse; font-size:.85rem; }
td { padding:6px 4px; border-bottom:1px solid #1f3626; vertical-align:top; }
td.f { white-space:nowrap; color:#c8c8c8; padding-right:12px; }
td.chk { width:28px; }
td.cat { white-space:nowrap; color:#c8c8c8; font-size:.78rem; text-align:right; }
.tf { color:#9aa; font-size:.78rem; }
.det { color:#778; font-size:.8rem; }
tr.hecha td { opacity:.45; text-decoration:line-through; }
.volver { display:inline-block; margin-bottom:14px; color:var(--dorado); text-decoration:none; font-weight:700; }
.chk-tarea { width:16px; height:16px; accent-color:var(--dorado); cursor:pointer; }
#mi-aviso { display:none; background:#1d3a24; border:1px solid #3f7a4f; color:#b6e6c3; padding:8px 14px; border-radius:10px; margin-bottom:12px; }
</style>
</head>
<body>
<a class="volver" href="index.html">🏭 ← Volver a Fábrica La Ronda</a>
<h1>💧 Aceites</h1>
<div class="sub">Producción de aceites: extracción, lotes y fechas de elaboración. · Actualizado 02/09/2026 12:24</div>
<div id="mi-aviso"></div>
<div class="card">
  <div class="fechas">
    <h3>📅 Fechas clave</h3>
    <table><tr><td colspan='2' style='color:#778'>Sin fechas cargadas todavía.</td></tr></table>
  </div>
  <div class="fechas">
    <h3>📋 Tareas</h3>
    <div class="tbody-wrap"><table><tr><th></th><th>Tarea</th><th></th></tr><tr><td colspan='3' style='color:#778'>Sin tareas todavía.</td></tr></table></div>
  </div>
</div>
<div class="sub" style="margin-top:16px">Generado por Julia 🦞</div>
<script>
const API = 'http://127.0.0.1:8082';
function aviso(m) { const a = document.getElementById('mi-aviso'); a.textContent = m; a.style.display = 'block'; setTimeout(() => a.style.display = 'none', 4000); }
document.addEventListener('change', async (e) => {
  if (!e.target.classList.contains('chk-tarea')) return;
  const c = e.target;
  try {
    const r = await fetch(API + '/api/tarea', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({sec: c.dataset.key, titulo: c.dataset.titulo, estado: c.checked ? 'hecha' : 'pendiente'}),
      signal: AbortSignal.timeout(8000)
    });
    const d = await r.json();
    if (d.ok) { c.closest('tr').classList.toggle('hecha', c.checked); aviso('✅ Tarea actualizada'); }
    else { c.checked = !c.checked; alert('Error: ' + (d.error || 'desconocido')); }
  } catch (err) { c.checked = !c.checked; alert('API local (:8082) no disponible — no se puede marcar.'); }
});
</script>
</body>
</html>
