<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛠️ Infraestructura — La Ronda Bariloche</title>
<style>
:root { --verde:#0d2d1a; --dorado:#d29914; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Segoe UI',system-ui,sans-serif; background:#0f1a12; color:#e8e8e8; padding:36px; }
h1 { color:var(--dorado); font-size:2.4rem; }
.sub { color:#9aa; font-size:1.35rem; margin:6px 0 30px; }
.card { background:#16281b; border:1.5px solid #2a4a33; border-radius:21px; padding:27px; max-width:1080px; margin-bottom:24px; }
.desc { color:#aab; font-size:1.35rem; margin-bottom:21px; }
.fechas { background:#0f1a12; border:1.5px solid #1f3626; border-radius:15px; padding:18px; margin-bottom:18px; }
.fechas h3 { color:var(--dorado); font-size:1.42rem; margin-bottom:12px; }
.tbody-wrap { overflow-y:auto; }
table { width:100%; border-collapse:collapse; font-size:1.27rem; }
td { padding:9px 6px; border-bottom:1.5px solid #1f3626; vertical-align:top; }
td.f { white-space:nowrap; color:#c8c8c8; padding-right:18px; }
td.chk { width:42px; }
td.cat { white-space:nowrap; color:#c8c8c8; font-size:1.17rem; text-align:right; }
.tf { color:#9aa; font-size:1.17rem; }
.det { color:#778; font-size:1.2rem; }
tr.hecha td { opacity:.45; text-decoration:line-through; }
.volver { display:inline-block; margin-bottom:21px; color:var(--dorado); text-decoration:none; font-weight:700; }
.chk-tarea { width:24px; height:24px; accent-color:var(--dorado); cursor:pointer; }
#mi-aviso { display:none; background:#1d3a24; border:1.5px solid #3f7a4f; color:#b6e6c3; padding:12px 21px; border-radius:15px; margin-bottom:18px; }
.agregar { background:#0f1a12; border:1.5px solid #1f3626; border-radius:15px; padding:21px; margin-bottom:18px; }
.agregar h3 { color:var(--dorado); font-size:1.35rem; margin-bottom:15px; }
.agregar form { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.agregar input, .agregar select { background:#16281b; color:#e8e8e8; border:1.5px solid #2a4a33;
   border-radius:12px; padding:10.5px 15px; font-size:1.27rem; width:100%; }
.agregar .full { grid-column:1 / -1; }
.agregar button { grid-column:1 / -1; background:var(--dorado); color:#0d2d1a; border:none;
   border-radius:12px; padding:12px; font-weight:700; cursor:pointer; font-size:1.27rem; }
.agregar button:hover { opacity:.9; }
</style>
</head>
<body>
<a class="volver" href="fabrica.html">← 🏭 Fábrica La Ronda</a>
<h1>🛠️ Infraestructura</h1>
<div class="sub">Instalaciones, equipos, arreglos y compras generales. · Actualizado 04/09/2026 13:14</div>
<div id="mi-aviso"></div>
<div class="card">
  <div class="agregar">
    <h3>➕ Agregar tarea</h3>
    <form id="frm-tarea">
      <input name="titulo" placeholder="Título de la tarea" required>
      <select name="categoria">
        <option value="hacer">✅ hacer</option>
        <option value="comprar">🛒 comprar</option>
        <option value="arreglar">🔧 arreglar</option>
        <option value="otro">• otro</option>
      </select>
      <input name="fecha" placeholder="Fecha (opcional) DD/MM/AAAA">
      <input name="detalle" class="full" placeholder="Detalle (opcional)">
      <button type="submit">➕ Agregar tarea</button>
    </form>
  </div>
  <div class="agregar">
    <h3>➕ Agregar fecha clave</h3>
    <form id="frm-fecha">
      <input name="titulo" placeholder="Título (ej: Extracción lote 3)" required>
      <input name="fecha" placeholder="Fecha DD/MM/AAAA" required>
      <input name="detalle" class="full" placeholder="Detalle (opcional)">
      <button type="submit">➕ Agregar fecha</button>
    </form>
  </div>
  <div class="fechas">
    <h3>📅 Fechas clave</h3>
    <table><tr><td colspan='2' style='color:#778'>Sin fechas cargadas todavía.</td></tr></table>
  </div>
  <div class="fechas">
    <h3>📋 Tareas</h3>
    <div class="tbody-wrap"><table><tr><th></th><th>Tarea</th><th></th></tr><tr><td colspan='3' style='color:#778'>Sin tareas todavía.</td></tr></table></div>
  </div>
</div>
<div class="sub" style="margin-top:24px">Generado por Julia 🦞</div>
<script>
const API_LOCAL = 'http://127.0.0.1:8082';
const API_NUBE = 'https://fabrica-api-sviz.onrender.com';
const API_KEY = 'Fr_88Mf-LBmaw1Daecj';
let API = API_LOCAL;
(async () => {
  try {
    const r = await fetch(API_LOCAL + '/api/estado', {signal: AbortSignal.timeout(1500)});
    if (!r.ok) API = API_NUBE;
  } catch (e) { API = API_NUBE; }
})();
const SEC = 'infraestructura';
function aviso(m) { const a = document.getElementById('mi-aviso'); a.textContent = m; a.style.display = 'block'; setTimeout(() => a.style.display = 'none', 4000); }
document.addEventListener('change', async (e) => {
  if (!e.target.classList.contains('chk-tarea')) return;
  const c = e.target;
  try {
    const r = await fetch(API + '/api/tarea', {
      method: 'POST', headers: {'Content-Type': 'application/json', 'X-API-Key': API_KEY},
      body: JSON.stringify({sec: c.dataset.key, titulo: c.dataset.titulo, estado: c.checked ? 'hecha' : 'pendiente'}),
      signal: AbortSignal.timeout(8000)
    });
    const d = await r.json();
    if (d.ok) { c.closest('tr').classList.toggle('hecha', c.checked); aviso('✅ Tarea actualizada'); }
    else { c.checked = !c.checked; alert('Error: ' + (d.error || 'desconocido')); }
  } catch (err) { c.checked = !c.checked; alert('API local (:8082) no disponible — no se puede marcar.'); }
});

async function enviar(url, data) {
  try {
    const r = await fetch(url, {
      method: 'POST', headers: {'Content-Type': 'application/json', 'X-API-Key': API_KEY},
      body: JSON.stringify(data), signal: AbortSignal.timeout(8000)
    });
    const d = await r.json();
    if (d.ok) { aviso('✅ Guardado'); setTimeout(() => location.reload(), 900); return true; }
    alert('Error: ' + (d.error || 'desconocido'));
  } catch (err) { alert('API local (:8082) no disponible'); }
  return false;
}

document.getElementById('frm-tarea').addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target;
  enviar(API + '/api/tarea', {sec: SEC, agregar: true, titulo: f.titulo.value,
    detalle: f.detalle.value, categoria: f.categoria.value, fecha: f.fecha.value, estado: 'pendiente'});
});
document.getElementById('frm-fecha').addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target;
  enviar(API + '/api/fecha', {sec: SEC, titulo: f.titulo.value, fecha: f.fecha.value, detalle: f.detalle.value});
});
</script>
</body>
</html>
